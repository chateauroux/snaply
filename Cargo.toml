# ============================================================================
#  Snaply v0.4.0 — лёгкая утилита для скриншотов
#  v0.4: встроенные ассеты (single .exe), ChopSS через браузер, бордовая тема
# ============================================================================

[package]
name        = "snaply"
version     = "0.4.0"
edition     = "2021"
description = "Лёгкая утилита для скриншотов с тёмным геймерским UI"
authors     = ["chateauroux"]
license     = "MIT"

# ============================================================================
#  ЗАВИСИМОСТИ
#  ВАЖНО: в TOML секция продолжается до следующего [..] заголовка.
#  Поэтому [dependencies.windows-sys] (с features) должен идти ПОСЛЕ
#  всех простых зависимостей, иначе они «проглотятся» как его поля.
# ============================================================================

[dependencies]

# eframe / egui — GUI-фреймворк (0.29: стабильный, Rounding API)
eframe = "0.29"
egui   = "0.29"

# winrt-notification — УБРАН: вместо него используем кастомный overlay
# в стиле Steam (модуль notification.rs). Системные тосты слишком медленные.

# tray-icon — иконка в системном трее с КЛИК-событиями
tray-icon = "0.19"

# image — сохранение в PNG / JPG / BMP
image = "0.25"

# chrono — имя файла Screen_YYYY-MM-DD_HH-MM-SS.ext
chrono = "0.4"

# rfd — нативный диалог выбора папки
rfd = "0.15"

# dirs — путь к Pictures в профиле пользователя
dirs = "5"

# arboard — копирование скриншота в буфер обмена
arboard = "3"

# ---------------------------------------------------------------------------
#  windows-sys — с features. Должен идти ПОСЛЕ всех простых зависимостей,
#  иначе всё что ниже попадёт в его подсекцию.
# ---------------------------------------------------------------------------
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Foundation",
]

# ---------------------------------------------------------------------------
#  Профиль release: компактный бинарник
# ---------------------------------------------------------------------------
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
